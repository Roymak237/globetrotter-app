# Container-level nginx.
#
# This VPS already runs a host nginx that owns ports 80/443 and terminates TLS
# for several other sites. So this server block speaks plain HTTP on an internal
# port and leaves certificates to the host proxy.
#
# Layout served here:
#   /            marketing landing page (static HTML/CSS/JS)
#   /app/        the compiled Flutter web app
#   /downloads/  release artefacts such as the Android APK
#   /api/        proxied to the backend container
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    root /usr/share/nginx/html;
    index index.html;

    # Matched before any static rule so the API is never shadowed.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Carried over from the host proxy so the backend sees the real scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://backend:5000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Flutter routes with no server-side file must fall back to the app shell,
    # not to the landing page, so deep links keep working after a refresh.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # The app shell references build artefacts by hashed name, so a stale copy
    # would request files that no longer exist.
    location = /app/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Release artefacts are large and immutable once published.
    location /downloads/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Build assets have hashed names, so they are safe to cache for a long time.
    location ~* \.(?:js|css|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The landing page changes on every release, so it must revalidate.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
