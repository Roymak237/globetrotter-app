# Container-level nginx.
#
# This VPS already runs a host nginx that owns ports 80/443 and terminates TLS
# for several other sites. So this server block speaks plain HTTP on an internal
# port and leaves certificates to the host proxy.
#
# Layout served here:
#   /            marketing landing page (static HTML/CSS/JS)
#   /app/        the compiled Flutter web app
#   /downloads/  release artefacts such as the Android APK
#   /api/        proxied to the backend container
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    root /usr/share/nginx/html;
    index index.html;

    # The call signalling socket. Declared before the general /api/ rule so the
    # Upgrade handshake is not swallowed by the plain HTTP proxy above it.
    location = /api/chat/ws {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A call can sit silent for a long time between signalling frames, so
        # the idle timeout has to outlast the conversation rather than the
        # request.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Matched before any static rule so the API is never shadowed.
    #
    # The `^~` is what actually delivers that promise. nginx tests regular
    # expressions before plain prefixes, so on a plain `location /api/` the
    # asset rule further down would capture anything under /api/ that happened
    # to end in a matched extension and try to serve it off disk.
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Carried over from the host proxy so the backend sees the real scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://backend:5000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # The compiled Flutter app.
    #
    # Flutter's web output is NOT content-hashed: every build emits the same
    # main.dart.js, flutter_bootstrap.js and flutter_service_worker.js. Caching
    # those by filename pins a returning browser to whichever build it happened
    # to load first, and it takes the service worker down with it — the very
    # mechanism that would otherwise pull the update through. A visitor can
    # then sit on a month-old app while the server serves a current one.
    #
    # The `^~` is load-bearing. nginx tests regular expression locations before
    # plain prefixes, so without it the asset rule further down claims every
    # .js under here and restores the month-long cache.
    #
    # `expires -1` does not disable caching; it requires revalidation. The
    # browser keeps its copy and asks whether it is still good, so an unchanged
    # 3.8 MB bundle answers 304 and costs a round trip rather than a download.
    location ^~ /app/ {
        expires -1;

        # `add_header` does not merge across levels: declaring any header here
        # would drop the server-level security headers for every file under
        # /app/. They are restated rather than inherited.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Flutter routes with no server-side file must fall back to the app
        # shell, not the landing page, so deep links survive a refresh.
        try_files $uri $uri/ /app/index.html;

        # ...but only routes. A missing *file* under here should fail as a
        # missing file rather than quietly returning the shell with a 200,
        # which would hand the browser HTML where it asked for a script and
        # surface as an unrelated syntax error. Flutter's deep links carry no
        # extension, so they still reach the fallback above.
        location ~* \.(?:css|js|mjs|map|json|wasm|bin|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf)$ {
            expires -1;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }
    }

    # The shell names the files it loads, so a stale copy would ask for a build
    # that no longer exists. Exact matches outrank the prefix above.
    location = /app/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Release artefacts are large and immutable once published.
    location ^~ /downloads/ {
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Destination photography: a large set that is added to far more often than
    # it is edited in place, so holding it is safe and worth the bandwidth.
    location ^~ /media/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # A missing static file has to fail as a missing static file.
    #
    # The catch-all below answers anything it cannot find with index.html and
    # a 200. That is correct for client-side routes and wrong for assets: a
    # broken <img> or <link> receives HTML labelled text/html, renders
    # nothing, and reports no error anywhere - no red line in the console, no
    # failure in a health check, nothing in the access log but a 200. A
    # half-finished deploy therefore looks completely healthy. That is exactly
    # what happened during the app-icon rollout: /app-icon-192.jpg answered
    # 200 with 10 KB of markup for eighteen minutes.
    #
    # Extensions are matched rather than paths because the distinction that
    # matters is "names a file" against "names a route", and routes do not
    # carry file extensions. Every prefix above uses `^~`, which outranks a
    # regex, so /api/, /app/, /downloads/ and /media/ keep their own rules.
    location ~* \.(?:css|js|mjs|map|json|txt|xml|wasm|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf|apk)$ {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The landing page and its own styles.css and app.js are not hashed either,
    # and they change on release. Revalidation keeps them correct at the cost of
    # one conditional request.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
