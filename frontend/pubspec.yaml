name: globetrotter
description: A travel app for discovering Cameroon.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.1
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  pointer_interceptor: ^0.10.1+2
  webview_windows: ^0.4.0
  # Chat attachments: picking files, and the multipart MIME types they are
  # uploaded with. file_picker is held at 13.x because earlier majors pin an
  # older win32 than geolocator requires, which makes the two unresolvable.
  file_picker: ^13.1.0
  http_parser: ^4.0.2
  path_provider: ^2.1.4
  # Playback and capture for voice notes, shared audio and shared video.
  audioplayers: ^6.1.0
  record: ^5.1.2
  video_player: ^2.9.2
  # Opening a taxi booking, map directions or an attachment the app cannot
  # render itself in the platform's own handler.
  url_launcher: ^6.3.0
  # Peer-to-peer audio and video calling.
  flutter_webrtc: ^0.12.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates the platform launcher icons from a single source image. A build
  # time tool only: it writes into android/, ios/ and web/ and is never part of
  # the shipped app.
  flutter_launcher_icons: ^0.14.4

# record 5.2.1 asks for record_linux ^0.7.1, but 0.7.2 was written against an
# older record_platform_interface than the 1.6.0 the rest of the record family
# pulls in, so RecordLinux no longer satisfies the interface it implements and
# the Android release build fails at kernel snapshot. record_linux 1.3.1
# declares record_platform_interface ^1.5.0, which 1.6.0 satisfies. Only the
# Linux implementation is swapped; the API this app calls is unchanged.
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - web/
    - assets/developer.jpg
    - assets/icons/icon.png
    - assets/images/
    - assets/images/dining/
    - assets/images/gaming/
    - assets/images/leisure/
    - assets/images/recreational/
    - assets/images/Schools/
    - assets/images/shopping/
    - assets/images/tourist/

# Launcher icons, generated from one source image by `dart run
# flutter_launcher_icons`. The generated files are committed, so a clean
# checkout builds a correctly branded app without anyone remembering to run
# this first.
flutter_launcher_icons:
  image_path: "assets/icons/icon.png"

  android: "ic_launcher"
  min_sdk_android: 21

  # Android 8 and later mask the icon to whatever shape the launcher prefers,
  # and only the centre 66% of the foreground is guaranteed to survive that
  # crop. This artwork fills 94% of its canvas, so handing it over untouched
  # would slice the edges off on most devices. The inset scales it into the
  # safe zone, and the background matches the near-black the artwork already
  # sits on so the two read as one image rather than a square on a field.
  adaptive_icon_foreground: "assets/icons/icon.png"
  adaptive_icon_foreground_inset: 20
  adaptive_icon_background: "#000000"

  # iOS forbids transparency in app icons and will reject a build that has it.
  # The source is opaque already, but removing alpha is declared rather than
  # assumed, since a later edit to the artwork could reintroduce it.
  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#000000"
    theme_color: "#B4462A"
