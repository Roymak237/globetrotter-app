<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kamer-Go: discover destinations across Cameroon and plan your trip itineraries.">

  <!-- Lets a deployed build be identified from the served page alone, which is
       how the CI pipeline and a browser refresh confirm a release went live. -->
  <meta name="build-channel" content="ci">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kamer-Go">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kamer-Go</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Flutter does not content-hash its web output: flutter_bootstrap.js and
    main.dart.js carry the same names in every build. index.html is served
    no-store so it always arrives fresh, but a browser holding a cached
    bootstrap will not re-request it, and that stale copy names the previous
    service worker version — so the browser never discovers that a newer app
    exists.

    The deploy replaces RELEASE_ID with the commit being shipped, making this
    a URL no browser has seen before and stepping around any cached copy. The
    fresh bootstrap then advertises the current service worker, which refetches
    the app with cache: 'reload' and pulls main.dart.js past the HTTP cache.

    Left unreplaced during local development, where the constant is harmless.
  -->
  <script src="flutter_bootstrap.js?v=RELEASE_ID" async></script>
</body>
</html>
