# The build server has 8 GB of RAM shared with Jenkins, nginx, the backend and
# several unrelated containers, and it is already well into swap before a build
# starts. The Flutter template's -Xmx8G asks for the whole machine, so the
# kernel killed the Gradle daemon part-way through assembleRelease and the APK
# stage failed with "Gradle build daemon disappeared unexpectedly". These
# ceilings reflect what this build actually needs rather than what the host has.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compiles in its own JVM, which inherits generous defaults and doubles
# the footprint. Bounding it keeps the pair inside the memory budget while
# leaving the compiler in its own process, so compilation behaviour is unchanged.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# Four workers on four cores each claim their own heap. Two finish this project
# in much the same wall time without competing for memory.
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
