# The build server has 8 GB of RAM shared with Jenkins, nginx, the backend and
# several unrelated containers, and it is already well into swap before a build
# starts. The Flutter template's -Xmx8G asks for the whole machine, so the
# kernel killed the Gradle daemon part-way through assembleRelease and the APK
# stage failed with "Gradle build daemon disappeared unexpectedly".
#
# These ceilings are chosen together with the container limit in the pipeline
# (MEM_ANDROID), not independently of it. The two JVMs below total roughly
# 3.5 GB once native overhead is counted, which sits comfortably inside that
# limit and leaves the rest of the host its working memory. If the project ever
# genuinely outgrows this, it fails with an OutOfMemoryError and a heap dump,
# which is a far easier thing to act on than a daemon that simply vanishes.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compiles in its own JVM, which inherits generous defaults and would
# otherwise double the footprint. Bounding it keeps the pair inside the budget
# while leaving the compiler in its own process, so behaviour is unchanged.
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m

# Four workers on four cores each claim their own heap. Two finish this project
# in much the same wall time without competing for memory.
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
