# The build server has 8 GB of RAM shared with Jenkins, nginx, the backend and
# several unrelated containers. The Flutter template's -Xmx8G asks for the whole
# machine, so the kernel killed the Gradle daemon part-way through
# assembleRelease and the stage failed with "Gradle build daemon disappeared
# unexpectedly" — a kill, not an OutOfMemoryError, which is why no heap dump
# ever appeared.
#
# The first attempt at a fix capped the two heaps and assumed that bounded the
# build. It did not. Measuring a running build showed the Gradle daemon holding
# 2213 MB against an -Xmx of 1536m, because every JVM also pays native overhead
# for GC structures, thread stacks and the JIT that -Xmx does not cover. Worse,
# Kotlin had forked two compiler JVMs of 775 MB and 661 MB, not the single one
# the earlier comment assumed. The container sat at 99% of its ceiling.
#
# So the number of JVMs is reduced rather than only their heaps. Kotlin now
# compiles inside the Gradle daemon, removing roughly 1.4 GB of separate
# processes. The heap below is larger because it now carries that work too,
# which is still a clear net saving.
#
# These values are chosen together with MEM_ANDROID in the pipeline, not
# independently of it. Changing one without the other reintroduces the fault.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Compile Kotlin in the Gradle daemon rather than a separate one. This trades
# a little incremental-build speed, which a clean CI checkout never benefits
# from anyway, for roughly a gigabyte of resident memory.
kotlin.compiler.execution.strategy=in-process

# Four workers on four cores each claim their own heap. Two finish this project
# in much the same wall time without competing for memory.
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
